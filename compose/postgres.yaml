services:
  postgres:
    image: 'pgvector/pgvector:0.8.7-pg18'
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      - 'POSTGRES_DB=banking'
      - 'POSTGRES_USER=banking'
      - 'POSTGRES_PASSWORD=local-only'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U banking -d banking']
      interval: 2s
      timeout: 2s
      retries: 30
